appId: com.ibkr.financial-advisor
productName: DeltaAdvisor

directories:
  output: dist-electron
  buildResources: assets

files:
  - dist/**/*
  - electron/**/*
  - package.json

mac:
  category: public.app-category.finance
  icon: assets/icon.icns
  darkModeSupport: true
  # Builds for the host architecture only: the PyInstaller backend binary is
  # native to the machine that froze it, so a universal app would ship a
  # backend that can't run on the other architecture.
  target:
    - dmg
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: assets/entitlements.mac.plist
  entitlementsInherit: assets/entitlements.mac.plist

dmg:
  title: "DeltaAdvisor"
  backgroundColor: "#0a0a0a"

extraResources:
  - from: backend-dist/
    to: backend
    filter:
      - "**/*"

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
