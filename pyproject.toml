[project]
name = "ibkr-financial-advisor-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "ib-insync>=0.9.86",
    "sqlmodel>=0.0.21",
    "aiosqlite>=0.20.0",
    "anthropic>=0.40.0",
    "pydantic-settings>=2.7.0",
    "python-dotenv>=1.0.0",
    "websockets>=13.0",
    "pyinstaller>=6.11.0",
    "sqlalchemy[asyncio]>=2.0",
    "openai>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
]

[tool.uv]
# This is an application, not an installable library
package = false
